name: Update Rules

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "personal-ai.list"
      - "scripts/build_rules.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build merged rulesets
        run: python3 scripts/build_rules.py

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain generated/)" ]; then
            echo "No rule changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git commit -m "chore(rules): update generated rulesets"
          git push
